<!DOCTYPE html>
<html>
<head>
    <title>Complete Stock Signal Dashboard</title>
    <style>
        body { font-family: Arial; background-color: #f4f6f8; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #ccc; text-align: center; }
        th { background-color: #222; color: #fff; }
        .buy { background-color: #c8e6c9; }
        .sell { background-color: #ffcdd2; }
        .hold { background-color: #fff9c4; }
        h2 { color: #333; }
        select, button { margin-right: 10px; padding: 5px; }
        details summary {
    background: #e0e0e0;
    padding: 8px 12px;
    border-radius: 4px;
    margin-bottom: 6px;
}
    </style>
</head>
<body>
    <h2>📈 Real-Time Stock Signal Dashboard</h2>

    <div>
        <select id="filterSignal">
            <option value="">All Signals</option>
            <option value="BUY">BUY</option>
            <option value="SELL">SELL</option>
            <option value="HOLD">HOLD</option>
        </select>

        <select id="filterStrength">
            <option value="">All Strengths</option>
            <option value="Strong">Strong</option>
            <option value="Moderate">Moderate</option>
            <option value="Weak">Weak</option>
        </select>

        <button onclick="fetchSignals()">Filter</button>
        <button onclick="downloadCSV()">Download CSV</button>
    </div>

    <table id="signalTable">
        <thead>
            <tr>
                <th>Ticker</th>
                <th>Signal</th>
                <th>Price</th>
                <th>RSI</th>
                <th>MACD</th>
                <th>Volume</th>
                <th>EMA Status</th>
                <th>Signal Strength</th>
                <th>Trigger Time</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <h2>📜 Signal History</h2>
    <button onclick="loadHistory()">Load History</button>
    <ul id="history"></ul>

    <h2>💰 Backtest $1000 Trades</h2>
    <button onclick="loadBacktest()">Run Backtest</button>
    <ul id="backtest"></ul>

    <script>
        async function fetchSignals() {
            const signal = document.getElementById("filterSignal").value;
            const strength = document.getElementById("filterStrength").value;
            const url = new URL("http://localhost:8000/signals");
            if (signal) url.searchParams.append("signal", signal);
            if (strength) url.searchParams.append("strength", strength);

            const res = await fetch(url);
            const data = await res.json();
            const tbody = document.querySelector("#signalTable tbody");
            tbody.innerHTML = "";
            data.forEach(row => {
                const tr = document.createElement("tr");
                tr.className = row.signal.toLowerCase();
                tr.innerHTML = `
                    <td>${row.ticker}</td>
                    <td>${row.signal}</td>
                    <td>$${row.price}</td>
                    <td>${row.rsi}</td>
                    <td>${row.macd_trend}</td>
                    <td>${row.volume}</td>
                    <td>${row.ema_status}</td>
                    <td>${row.strength}</td>
                    <td>${row.timestamp}</td>
                    <td><button onclick="deleteTicker('${row.ticker}')">❌</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function deleteTicker(ticker) {
            await fetch(`http://localhost:8000/tickers/${ticker}`, { method: 'DELETE' });
            fetchSignals();
        }

        async function downloadCSV() {
            const res = await fetch("http://localhost:8000/export_csv");
            alert("CSV exported on server (check backend directory).");
        }

async function loadHistory() {
    const res = await fetch("http://localhost:8000/signal_history");
    const data = await res.json();
    const container = document.getElementById("history");
    container.innerHTML = "";

    if (!Array.isArray(data) || data.length === 0) {
        container.innerHTML = "<p>No signal history available.</p>";
        return;
    }

    // Group by ticker
    const grouped = {};
    data.forEach(d => {
        if (!grouped[d.ticker]) {
            grouped[d.ticker] = [];
        }
        grouped[d.ticker].push(d);
    });

    for (const [ticker, signals] of Object.entries(grouped)) {
        // Create expandable section
        const section = document.createElement("div");
        section.style.marginBottom = "20px";
        section.innerHTML = `
            <details>
                <summary style="font-size: 1.1em; font-weight: bold; cursor: pointer;">
                    ${ticker} (${signals.length} signals)
                </summary>
                <ul style="margin-left: 20px; margin-top: 10px;">
                    ${signals.map(d => `
                        <li>
                            <strong>${d.signal}</strong> @ $${d.price} on ${d.timestamp}<br/>
                            <em>RSI:</em> ${d.rsi} | 
                            <em>MACD:</em> ${d.macd_trend} | 
                            <em>EMA:</em> ${d.ema_status} | 
                            <em>Volume:</em> ${d.volume} | 
                            <em>Strength:</em> ${d.strength}
                        </li>
                    `).join("")}
                </ul>
            </details>
        `;
        container.appendChild(section);
    }
}


        async function loadBacktest() {
            const res = await fetch("http://localhost:8000/backtest");
            const data = await res.json();
            const ul = document.getElementById("backtest");
            ul.innerHTML = data.map(d => `<li>${d.ticker}: $${d.total_pl}</li>`).join("");
        }

        fetchSignals();
        setInterval(fetchSignals, 60000);
    </script>
</body>
</html>
